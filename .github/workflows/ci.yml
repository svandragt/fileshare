name: CI
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke test
        run: php tests/smoke.php
